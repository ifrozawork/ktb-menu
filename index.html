<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>KBBD Menu</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    rel="icon"
    type="image/jpeg"
    href="KBBD.jpg"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">

      <h2>
        🍽️ Kontoor's Smart Menu
      </h2>

    </div>


    <!-- RESTAURANT TABS -->
    <div
      class="tabs"
      id="tabs"
    ></div>


    <!-- MAIN LAYOUT -->
    <div class="layout">


      <!-- MENU -->
      <div class="menu-section">

        <div id="menu">

          <p>
            Loading menu...
          </p>

        </div>

      </div>


      <!-- CART -->
      <div
  class="cart-panel"
  id="cartPanel"
>

  <div class="cart-header">

    <h3>
      🧾 Your Order
    </h3>

    <button
      type="button"
      class="mobile-cart-close"
      id="closeCartBtn"
      aria-label="Close cart"
    >
      ×
    </button>

  </div>


        <div id="cart">

          <p>
            Your cart is empty.
          </p>

        </div>


        <input
          id="comments"
          type="text"
          placeholder="Add special instructions..."
        >


        <div class="cart-actions">

          <button
            class="secondary"
            id="clearBtn"
            type="button"
          >
            Clear Cart
          </button>


          <button
            id="confirmBtn"
            type="button"
          >
            Proceed
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- MOBILE FLOATING CART -->
  <div
    class="floating-cart"
    id="floatingCart"
  >

    🛒 View Cart

    <span id="cartCount">
      0
    </span>

  </div>


  <script src="script.js"></script>

</body>

</html>
