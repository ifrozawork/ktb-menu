<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>KBBD Menu</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <link
    rel="icon"
    type="image/jpeg"
    href="KBBD.jpg"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="container">

    <!-- HEADER -->
    <header class="header">

      <h2>
        🍽️ Kontoor's Smart Menu
      </h2>

    </header>


    <!-- RESTAURANT TABS -->
    <nav
      class="tabs"
      id="tabs"
      aria-label="Restaurants"
    ></nav>


    <!-- MAIN CONTENT -->
    <main class="layout">


      <!-- MENU -->
      <section class="menu-section">

        <div id="menu">

          <p class="loading">
            Loading menu...
          </p>

        </div>

      </section>


      <!-- CART -->
      <aside
        class="cart-panel"
        id="cartPanel"
        aria-label="Your order"
      >

        <div class="cart-header">

          <h3>
            🧾 Your Order
          </h3>

          <button
            type="button"
            class="mobile-cart-close"
            id="closeCartBtn"
            aria-label="Close cart"
          >
            ×
          </button>

        </div>


        <div id="cart">

          <p>
            Your cart is empty.
          </p>

        </div>


        <input
          id="comments"
          type="text"
          placeholder="Add special instructions..."
          autocomplete="off"
        >


        <div class="cart-actions">

          <button
            class="secondary"
            id="clearBtn"
            type="button"
          >
            Clear Cart
          </button>


          <button
            id="confirmBtn"
            type="button"
          >
            Proceed
          </button>

        </div>

      </aside>

    </main>

  </div>


  <!-- MOBILE CART BUTTON -->
  <button
    class="floating-cart"
    id="floatingCart"
    type="button"
    aria-label="Open cart"
  >

    <span>
      🛒 View Cart
    </span>

    <span
      class="cart-count"
      id="cartCount"
    >
      0
    </span>

  </button>


  <script src="script.js"></script>

</body>

</html>
